name: release

# Push a tag like v2026.10.0 to export, validate and publish every model in
# models.toml as GitHub Release assets that minicam admins can fetch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked --extra export
      - run: uv run pytest -m "export or not export"
      - name: Export, validate and bundle
        run: >
          uv run minicam-models export
          --out dist
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
      - name: Re-validate the bundle
        run: uv run minicam-models validate dist/*.onnx
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file dist/RELEASE_NOTES.md
          --verify-tag
          dist/*.onnx dist/manifest.json dist/SHA256SUMS
