name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked --extra export
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

      # Contract drift check against minicam. Runs only when the repository
      # variable MINICAM_REPOSITORY is set (and MINICAM_READ_TOKEN if private).
      - if: vars.MINICAM_REPOSITORY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.MINICAM_REPOSITORY }}
          ref: master
          token: ${{ secrets.MINICAM_READ_TOKEN || github.token }}
          path: minicam
          persist-credentials: false
      - if: vars.MINICAM_REPOSITORY != ''
        run: MINICAM_SRC="$PWD/minicam" uv run pytest tests/test_minicam_drift.py
