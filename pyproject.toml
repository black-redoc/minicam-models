[project]
name = "minicam-models"
version = "0.1.0"
description = "Reproducible YOLO ONNX exports that satisfy minicam's detection model contract."
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.0",
    "onnx==1.23.2",
    "onnxruntime==1.27.0",
]

[project.optional-dependencies]
# Heavy export toolchain: only needed to build models, not to validate them.
export = [
    "onnxslim==0.1.98",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.183",
]

[project.scripts]
minicam-models = "minicam_models.cli:main"

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[tool.uv]
# Wheels only: never run a package's build scripts (see docs/DEPENDENCIES.md).
no-build = true
no-build-package = []

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "ANN"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnx.*", "ultralytics.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["export: needs the export extra and network (downloads weights)"]
addopts = "-m 'not export'"
