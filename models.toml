# Catalog of models this repo publishes. Every source file is pinned by
# sha256; a mismatch aborts the export (see docs/SECURITY.md).
#
# Each model produces one asset per entry in `precisions`, named
# "<id>-<precision>.onnx" (e.g. yolov8n-int8.onnx).

[calibration]
# COCO128 (first 100 images calibrate INT8, the remaining 28 evaluate it).
url = "https://github.com/ultralytics/assets/releases/download/v0.0.0/coco128.zip"
sha256 = "61e5e3028863d8ffc3b81d6a514603954889f0edd5e4b44c4ce60b2da99aeb8e"
calibration_images = 100

